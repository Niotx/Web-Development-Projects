<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Chat Interface</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-light: #4ade80;
            --primary-dark: #22c55e;
            --bg-light: #ffffff;
            --bg-dark: #1a1a1a;
            --text-light: #333333;
            --text-dark: #ffffff;
            --message-user-light: linear-gradient(135deg, #4ade80, #22c55e);
            --message-bot-light: linear-gradient(135deg, #e2e8f0, #cbd5e1);
            --message-user-dark: linear-gradient(135deg, #22c55e, #16a34a);
            --message-bot-dark: linear-gradient(135deg, #374151, #1f2937);
        }

        [data-theme="dark"] {
            --bg-primary: var(--bg-dark);
            --text-primary: var(--text-dark);
            --message-user: var(--message-user-dark);
            --message-bot: var(--message-bot-dark);
        }

        [data-theme="light"] {
            --bg-primary: var(--bg-light);
            --text-primary: var(--text-light);
            --message-user: var(--message-user-light);
            --message-bot: var(--message-bot-light);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .chat-container {
            max-width: 1200px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(128, 128, 128, 0.2);
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .header-buttons {
            display: flex;
            gap: 1rem;
        }

        .btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 50%;
            color: var(--text-primary);
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: rgba(128, 128, 128, 0.1);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 70%;
            padding: 0.8rem 1rem;
            border-radius: 1rem;
            animation: messageAppear 0.3s ease-out;
            position: relative;
        }

        .message.user {
            background: var(--message-user);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 0.3rem;
        }

        .message.bot {
            background: var(--message-bot);
            align-self: flex-start;
            border-bottom-left-radius: 0.3rem;
        }

        .timestamp {
            font-size: 0.7rem;
            opacity: 0.7;
            margin-top: 0.3rem;
            text-align: right;
        }

        .footer {
            padding: 1rem;
            border-top: 1px solid rgba(128, 128, 128, 0.2);
        }

        .input-container {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .message-input {
            flex: 1;
            padding: 0.8rem;
            border: 1px solid rgba(128, 128, 128, 0.2);
            border-radius: 1.5rem;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-size: 1rem;
        }

        .message-input:focus {
            outline: none;
            border-color: var(--primary-light);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: var(--bg-primary);
            padding: 2rem;
            border-radius: 1rem;
            min-width: 300px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        @keyframes messageAppear {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .message {
                max-width: 85%;
            }

            .header h1 {
                font-size: 1.2rem;
            }

            .modal-content {
                width: 90%;
                margin: 1rem;
            }
        }
    </style>
</head>
<body data-theme="light">
    <div class="chat-container">
        <header class="header">
            <h1>Chat</h1>
            <div class="header-buttons">
                <button class="btn" id="theme-toggle" aria-label="Toggle theme">
                    <i class="fas fa-moon"></i>
                </button>
                <button class="btn" id="settings-toggle" aria-label="Open settings">
                    <i class="fas fa-cog"></i>
                </button>
            </div>
        </header>

        <main class="chat-messages" id="chat-messages">
            <!-- Messages will be dynamically added here -->
        </main>

        <footer class="footer">
            <div class="input-container">
                <button class="btn" aria-label="Upload file">
                    <i class="fas fa-paperclip"></i>
                </button>
                <button class="btn" aria-label="Record voice message">
                    <i class="fas fa-microphone"></i>
                </button>
                <input type="text" class="message-input" placeholder="Type a message..." aria-label="Message input">
                <button class="btn" id="send-message" aria-label="Send message">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </footer>
    </div>

    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Settings</h2>
                <button class="btn" id="close-modal" aria-label="Close settings">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="setting-item">
                    <span>Dark Mode</span>
                    <input type="checkbox" id="theme-switch" aria-label="Toggle dark mode">
                </div>
                <div class="setting-item">
                    <span>Notifications</span>
                    <input type="checkbox" id="notifications" aria-label="Toggle notifications">
                </div>
                <div class="setting-item">
                    <span>Sound Effects</span>
                    <input type="checkbox" id="sound-effects" aria-label="Toggle sound effects">
                </div>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const themeToggle = document.getElementById('theme-toggle');
        const settingsToggle = document.getElementById('settings-toggle');
        const modal = document.getElementById('settings-modal');
        const closeModal = document.getElementById('close-modal');
        const chatMessages = document.getElementById('chat-messages');
        const sendButton = document.getElementById('send-message');
        const messageInput = document.querySelector('.message-input');
        const themeSwitch = document.getElementById('theme-switch');

        // Theme Toggle
        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            body.setAttribute('data-theme', newTheme);
            themeSwitch.checked = newTheme === 'dark';
            
            // Update theme toggle icon
            const icon = themeToggle.querySelector('i');
            icon.className = newTheme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        }

        themeToggle.addEventListener('click', toggleTheme);
        themeSwitch.addEventListener('change', toggleTheme);

        // Modal Controls
        settingsToggle.addEventListener('click', () => {
            modal.style.display = 'block';
        });

        closeModal.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        window.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.style.display = 'none';
            }
        });

        // Message Handling
        function addMessage(text, isUser = true) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;
            
            const messageText = document.createElement('div');
            messageText.textContent = text;
            
            const timestamp = document.createElement('div');
            timestamp.className = 'timestamp';
            timestamp.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            messageDiv.appendChild(messageText);
            messageDiv.appendChild(timestamp);
            chatMessages.appendChild(messageDiv);
            
            // Scroll to bottom
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Send Message
        function sendMessage() {
            const text = messageInput.value.trim();
            if (text) {
                addMessage(text, true);
                messageInput.value = '';
                
                // Simulate bot response
                setTimeout(() => {
                    addMessage('Thanks for your message!', false);
                }, 1000);
            }
        }

        sendButton.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Add some initial messages
        addMessage('Hello! How can I help you today?', false);
    </script>
</body>
</html>
