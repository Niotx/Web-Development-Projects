<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Interface</title>
    <link rel="stylesheet" href="./style.css">
    <script src="https://cdn.jsdelivr.net/npm/@iconify/iconify@1.0.7/dist/iconify.min.js"></script>
</head>
<body>
    <div id="app">
        <header>
            <button id="settingsButton" onclick="openSettings()">⚙️</button>
            <button id="themeToggle" onclick="toggleTheme()">🌙</button>
        </header>
        <main id="messagesContainer"></main>
        <footer>
            <input id="inputField" type="text" placeholder="Type a message">
            <button id="sendButton" onclick="sendMessage()">Send</button>
            <button id="micButton">🎤</button>
        </footer>

        <div id="settingsDialog" class="dialog">
            <h2>Settings</h2>
            <button onclick="closeSettings()">Close</button>
            <!-- Add settings options here -->
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
